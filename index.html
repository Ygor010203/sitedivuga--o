    <style>
        * {
            margin: 0;
            padding: 0;

        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;

        }
        .logo-placeholder {
            width: 90px;

            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #16a34a;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
